# Production PostgreSQL Profile
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/disaster_relief_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:9a7c3e1b5f8d2a4e6c0b3d5e7f9a1c3e5b7d9f1a3c5e7b9d1f3a5c7e9b1d3f5a}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.github.io,http://localhost:5173}
